name: TestFlight candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the candidate tag (without v)
        required: true
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    environment: testflight
    steps:
      - name: Require recorded acceptance before distribution
        env:
          ACCEPTANCE_VERIFIED: ${{ vars.RELEASE_ACCEPTANCE_VERIFIED }}
        run: python3 -c 'import os; assert os.environ.get("ACCEPTANCE_VERIFIED") == "true", "Product acceptance gates have not been recorded"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate tag and build toolchain
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 -c 'import os; assert os.environ["GITHUB_REF"] == "refs/tags/v"+os.environ["RELEASE_VERSION"]'
          python3 scripts/check_apple_toolchain.py
      - name: Configure signing and App Store Connect credentials
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_PROFILES_BASE64: ${{ secrets.SIGNING_PROFILES_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
        run: python3 scripts/install_signing.py
      - run: |
          brew install mint
          mint run yonaskolb/XcodeGen@2.44.1 xcodegen generate
          swift test
          python3 scripts/check_contract.py
          python3 scripts/check_localization.py
      - name: Archive and export
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project mealf.xcodeproj -scheme mealf -configuration Release -destination 'generic/platform=iOS' -archivePath build/mealf.xcarchive DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          xcodebuild -exportArchive -archivePath build/mealf.xcarchive -exportPath build/export -exportOptionsPlist Config/ExportOptions.plist
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios --file build/export/mealf.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: testflight-build
          path: build
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/install_signing.py --cleanup
