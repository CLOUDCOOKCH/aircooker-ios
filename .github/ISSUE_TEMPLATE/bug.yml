name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: App, server and operating system versions
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Never include passwords, session tokens, recipes, prompts or API keys.
