name: aircooker
options:
  bundleIdPrefix: ch.cloudcook
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  preGenCommand: /usr/bin/sips --resampleHeightWidth 1024 1024 Design/AppIconSource.png --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    AIRCOOKER_APP_GROUP: group.ch.cloudcook.aircooker
packages:
  AirCookerCore:
    path: .
targets:
  aircooker:
    type: application
    platform: iOS
    sources:
      - App
      - Resources
    dependencies:
      - package: AirCookerCore
      - target: AirCookerShare
        embed: true
      - target: AirCookerWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cloudcook.aircooker
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a QR code containing your server address.
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: mealf
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Unlock your household recipes and meal plan.
        AirCookerAppGroup: $(AIRCOOKER_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aircooker]
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: [$(AIRCOOKER_APP_GROUP)]
  AirCookerShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Resources
    dependencies:
      - package: AirCookerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cloudcook.aircooker.share
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Share-Info.plist
      properties:
        CFBundleDisplayName: mealf
        AirCookerAppGroup: $(AIRCOOKER_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Config/Share.entitlements
      properties:
        com.apple.security.application-groups: [$(AIRCOOKER_APP_GROUP)]
  AirCookerWidget:
    dependencies:
      - package: AirCookerCore
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - Resources
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: mealf
        AirCookerAppGroup: $(AIRCOOKER_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cloudcook.aircooker.widget
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(AIRCOOKER_APP_GROUP)]
  AirCookerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: aircooker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cloudcook.aircooker.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  aircooker:
    build:
      targets:
        aircooker: all
    test:
      targets:
        - AirCookerUITests
